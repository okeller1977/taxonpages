taxa_page:
  overview:
    panels:
      - - - panel:gallery
          - panel:type
          - panel:type-specimen
          - panel:nomenclature
          - panel:nomenclature-references

        - - panel:map
          - panel:descendants
          - panel:scrutiny
          - panel:content
          - panel:keys
          - panel:gbif
          - panel:statistics
  specimen_records:
    label: 'Specimen & Occurrence Records'
    # No rank_group restriction — experimentally enabled for every rank (see
    # PanelSpecimenOccurrences.vue's isHigherTaxon). Genus/subgenus is the
    # only range actually verified to perform reasonably; tribe and up are
    # untested/likely impractical (see project memory) but left open on
    # purpose to see how it actually behaves rather than pre-judging it.
    panels:
      - - - panel:specimen-occurrences
  asserted_distributions:
    label: 'Asserted Distributions'
    rank_group: ['SpeciesGroup']
    panels:
      - - - id: panel:asserted-distributions    
  iNaturalist:
    label: 'iNaturalist'
    rank_group: ['GenusGroup', 'SpeciesGroup']
    panels:
      - - - panel:inaturalist
